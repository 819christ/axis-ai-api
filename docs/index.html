<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Axis AI api — code source (lecture seule)</title>
<meta name="robots" content="index,follow" />
<style>
  :root { --bg:#111827; --surface:#182235; --raised:#202d43; --fg:#e5edf8; --muted:#91a1b8; --accent:#66b3ff; --border:#30415a; --folder:#f0c674; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); color:var(--fg); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; align-items:center; flex-wrap:wrap; gap:.75rem; padding:1rem 1.5rem; border-bottom:1px solid var(--border); background:var(--surface); }
  header h1 { margin:0; font-size:1.1rem; letter-spacing:.01em; }
  .badge { padding:.3rem .65rem; border-radius:999px; background:#263b58; color:#b9dcff; font-size:.78rem; font-weight:600; }
  .header-actions { display:flex; align-items:center; gap:.6rem; margin-left:auto; }
  .header-link,.action-button { display:inline-flex; align-items:center; gap:.45rem; min-height:2.35rem; padding:.45rem .8rem; border:1px solid var(--border); border-radius:.65rem; font:inherit; font-size:.86rem; font-weight:600; text-decoration:none; cursor:pointer; transition:background .15s,border-color .15s,transform .15s; }
  .header-link { color:#8cc8ff; background:transparent; }
  .action-button { color:var(--fg); background:var(--raised); }
  .header-link:hover,.action-button:hover { background:#2b3d58; border-color:var(--accent); transform:translateY(-1px); }
  .icon { width:1rem; height:1rem; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .layout { display:flex; flex:1; min-height:0; overflow:hidden; }
  .sidebar { width:300px; padding:.75rem; overflow-y:auto; border-right:1px solid var(--border); background:#151f31; }
  .sidebar-search { position:sticky; top:0; z-index:1; padding-bottom:.7rem; background:#151f31; }
  .sidebar input { width:100%; padding:.65rem .75rem; border:1px solid var(--border); border-radius:.6rem; outline:none; background:var(--raised); color:var(--fg); font:inherit; }
  .sidebar input:focus { border-color:var(--accent); box-shadow:0 0 0 2px #66b3ff33; }
  .tree { contain:content; }
  .tree-folder,.tree-file { display:flex; align-items:center; gap:.4rem; min-height:1.9rem; padding:.25rem .45rem; border-radius:.45rem; white-space:nowrap; font-size:.88rem; }
  .tree-folder { color:var(--folder); cursor:pointer; font-weight:650; user-select:none; }
  .tree-file { color:#b9c8dc; cursor:pointer; }
  .tree-folder:hover,.tree-file:hover { background:#24344c; }
  .tree-file.active { background:#2d4868; color:#fff; }
  .tree-chevron { width:.8rem; transition:transform .15s; }
  .tree-folder[aria-expanded="false"] .tree-chevron { transform:rotate(-90deg); }
  .tree-folder[aria-expanded="false"] + .tree-children { display:none; }
  .tree-children { margin-left:.8rem; padding-left:.45rem; border-left:1px solid #30415a99; }
  main { flex:1; min-width:0; overflow:auto; }
  .file-header { position:sticky; top:0; z-index:2; display:flex; align-items:center; padding:.9rem 1.5rem; border-bottom:1px solid var(--border); background:#111827ee; backdrop-filter:blur(8px); }
  .file-header strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.95rem; }
  .code-viewer { counter-reset:line; padding:1rem 0; font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:.9rem; line-height:1.55; overflow:auto; }
  .code-line { display:flex; min-height:1.4em; }
  .code-line::before { counter-increment:line; content:counter(line); display:inline-block; width:3em; margin-right:1em; color:var(--muted); text-align:right; user-select:none; flex-shrink:0; }
  .code-line-content { flex:1; white-space:pre; }
  .status,.loading { padding:2rem; color:var(--muted); }
  @media (max-width:700px) { .sidebar { width:38vw; min-width:190px; } header { padding:.8rem; } .header-actions { margin-left:0; width:100%; } }
</style>
</head>
<body>
<header>
  <h1>Axis AI api</h1><span class="badge">main</span><span class="badge">Lecture seule</span>
  <div class="header-actions">
    <a class="header-link" href="https://github.com/819christ/axis-ai-api" target="_blank" rel="noopener noreferrer"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg><span>Dépôt GitHub</span></a>
    <button class="action-button" id="copyBtn" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copier</span></button>
    <a class="action-button" id="rawLink" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg><span>Brut</span></a>
  </div>
</header>
<div class="layout"><aside class="sidebar"><div class="sidebar-search"><input id="filter" type="search" placeholder="Filtrer les fichiers..." aria-label="Filtrer les fichiers" /></div><div id="tree" class="tree loading">Chargement de l'arborescence...</div></aside>
  <main><div id="fileHeader" class="file-header" style="display:none"><strong id="filePath"></strong></div><div id="content" class="status">Sélectionne un fichier dans la liste à gauche.</div></main>
</div>
<script>
const OWNER="819christ", REPO="axis-ai-api", BRANCH="main";
const EXCLUDED_PREFIXES=["docs/",".git/",".vscode/"]; let allPaths=[]; let currentText="";
function isExcluded(path){return EXCLUDED_PREFIXES.some(p=>path.startsWith(p));}
async function loadTree(){const treeEl=document.getElementById("tree");try{const res=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);if(!res.ok)throw new Error("HTTP "+res.status);const data=await res.json();allPaths=data.tree.filter(item=>item.type==="blob"&&!isExcluded(item.path)).map(item=>item.path).sort();renderTree(allPaths);}catch(err){treeEl.textContent="Impossible de charger la liste des fichiers ("+err.message+"). Réessaie dans quelques instants.";}}
function renderTree(paths){const treeEl=document.getElementById("tree");if(!paths.length){treeEl.textContent="Aucun fichier publié pour le moment.";return;}treeEl.innerHTML="";const root={folders:new Map(),files:[]};for(const path of paths){let node=root;const parts=path.split("/");parts.forEach((part,index)=>{if(index===parts.length-1)node.files.push({name:part,path});else{if(!node.folders.has(part))node.folders.set(part,{folders:new Map(),files:[]});node=node.folders.get(part);}});}appendTreeNode(root,treeEl);}
function appendTreeNode(node,parent){for(const [name,child] of node.folders){const folder=document.createElement("div");folder.className="tree-folder";folder.setAttribute("role","button");folder.setAttribute("aria-expanded","true");folder.innerHTML='<svg class="icon tree-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>';folder.appendChild(document.createTextNode(name));const children=document.createElement("div");children.className="tree-children";folder.onclick=()=>folder.setAttribute("aria-expanded",folder.getAttribute("aria-expanded")!=="true"?"true":"false");parent.append(folder,children);appendTreeNode(child,children);}for(const file of node.files){const div=document.createElement("div");div.className="tree-file";div.dataset.path=file.path;div.innerHTML='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>';div.appendChild(document.createTextNode(file.name));div.onclick=e=>{e.stopPropagation();openFile(file.path,div);};parent.appendChild(div);}}
async function openFile(path,el){document.querySelectorAll(".tree-file").forEach(e=>e.classList.remove("active"));if(el)el.classList.add("active");const contentEl=document.getElementById("content");document.getElementById("filePath").textContent=path;const rawUrl=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${path}`;document.getElementById("rawLink").href=rawUrl;document.getElementById("rawLink").setAttribute("aria-disabled","false");document.getElementById("fileHeader").style.display="flex";contentEl.className="loading";contentEl.textContent="Chargement du contenu...";try{const res=await fetch(rawUrl);if(!res.ok)throw new Error("HTTP "+res.status);currentText=await res.text();renderCode(currentText);}catch(err){contentEl.className="status";contentEl.textContent="Impossible de charger ce fichier ("+err.message+").";}}
function renderCode(text){const contentEl=document.getElementById("content");contentEl.className="code-viewer";contentEl.innerHTML="";for(const line of text.split("\n")){const row=document.createElement("div");row.className="code-line";const span=document.createElement("span");span.className="code-line-content";span.textContent=line;row.appendChild(span);contentEl.appendChild(row);}}
document.getElementById("copyBtn").onclick=async()=>{if(!currentText)return;try{await navigator.clipboard.writeText(currentText);const label=document.querySelector("#copyBtn span"),original=label.textContent;label.textContent="Copié !";setTimeout(()=>label.textContent=original,1500);}catch(err){console.error("Copie impossible",err);}};
document.getElementById("filter").addEventListener("input",e=>{const q=e.target.value.toLowerCase();renderTree(allPaths.filter(p=>p.toLowerCase().includes(q)));});loadTree();
</script>
</body></html>
